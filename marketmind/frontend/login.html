<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register | MarketMind</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Market<span>Mind</span></a>

            <div class="nav-actions">
                <a href="index.html" class="nav-link">Home</a>
                <a href="wishlist.html" class="nav-link">Wishlist</a>
                <a href="dashboard.html" class="nav-link">Seller Portal</a>
            </div>
        </div>
    </header>

    <!-- Auth Container -->
    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Login</button>
                <button type="button" class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Register</button>
            </div>

            <div id="auth-message" class="auth-message" style="display: none;"></div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Sign in to continue shopping or manage your store.</p>

                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-primary w-100">Login</button>
            </form>

            <!-- Register Form (Hidden by default) -->
            <form id="register-form" class="auth-form" style="display: none;">
                <h2>Create an Account</h2>
                <p class="auth-subtitle">Join MarketMind as a customer or seller.</p>

                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" placeholder="Aarav Sharma" required>
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-role">Account Role</label>
                    <select id="reg-role">
                        <option value="customer">Customer</option>
                        <option value="seller">Seller</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" placeholder="At least 6 characters" required>
                </div>

                <div class="form-group">
                    <label for="reg-confirm-password">Confirm Password</label>
                    <input type="password" id="reg-confirm-password" placeholder="Re-enter password" required>
                </div>

                <button type="submit" class="btn-primary w-100">Create Account</button>
            </form>
        </div>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
